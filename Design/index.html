<script>
'use strict';
const paths={folder:'M3 6h6l2 2h10v12H3z M3 6V4h6l2 2',home:'m3 10 9-7 9 7 M5 9v12h5v-7h4v7h5V9',gallery:'M3 3h18v18H3z m0 14 6-6 5 5 3-3 4 4 M16 7h.01',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2',star:'m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z',cloud:'M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5 5 0 0 1 0 11z',desktop:'M3 4h18v13H3z M8 21h8 M12 17v4',download:'M12 3v12 m-5-5 5 5 5-5 M4 17v4h16v-4',file:'M5 3h9l5 5v13H5z M14 3v6h5 M8 13h8 M8 17h6',music:'M9 18V5l11-2v13 M9 8l11-2 M9 18a3 2 0 1 1-3-2 3 2 0 0 1 3 2 M20 16a3 2 0 1 1-3-2 3 2 0 0 1 3 2',drive:'M4 4h16l2 13H2z M2 17v4h20v-4 M17 19h.1',network:'M9 3h6v6H9z M3 17h6v5H3z M15 17h6v5h-6z M12 9v4 M6 17v-4h12v4',trash:'M3 6h18 M5 6l1 15h12l1-15 M9 6V3h6v3 M10 10v7 M14 10v7',plus:'M12 5v14 M5 12h14',cut:'M9 8 20 20 M9 16 20 4 M6 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6 M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6',copy:'M8 8h13v13H8z M16 8V3H3v13h5',paste:'M9 5H5v16h14V5h-4 M9 3h6v5H9z',rename:'M3 8h18v11H3z M10 3h6 M13 3v18 M10 21h6',share:'M12 15V2 m-4 4 4-4 4 4 M7 9H3v12h18V9h-4',sort:'M4 4v16 m-3-3 3 3 3-3 M10 5h11 M10 10h8 M10 15h5 M10 20h2',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',list:'M8 5h13 M8 12h13 M8 19h13 M3 5h.1 M3 12h.1 M3 19h.1',more:'M4 12h.1 M12 12h.1 M20 12h.1',panel:'M3 3h18v18H3z M15 3v18',left:'m14 5-7 7 7 7',right:'m10 5 7 7-7 7',up:'m5 14 7-7 7 7',refresh:'M20 7A9 9 0 1 0 21 14 M20 3v5h-5',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 m5 12 6 6',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',keyboard:'M2 5h20v14H2z M5 9h.1 M9 9h.1 M13 9h.1 M17 9h.1 M5 12h.1 M9 12h.1 M13 12h.1 M17 12h.1 M6 16h12',check:'m5 12 4 4L20 5',info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 11v6 M12 7h.1',terminal:'m4 6 6 6-6 6 M13 18h7',zip:'M5 3h14v18H5z M12 3v11 M10 14h4v4h-4z',tag:'M3 3h8l10 10-8 8L3 11z M7 7h.1'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.file}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icons(){document.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}
const roots=[['Home','home'],['Gallery','gallery'],['iCloud Drive','cloud'],['Desktop','desktop'],['Downloads','download'],['Documents','file'],['Pictures','gallery'],['Music','music'],['This Mac','desktop'],['Network','network'],['Trash','trash']];
function initialFiles(){const a=[];let id=1;const add=(name,parent,folder,size,tag)=>a.push({id:String(id++),name,parent,folder,size:size||0,modified:'2026-09-14T09:12:00',tag:tag||'',original:null});for(const n of ['Projects','Design','Personal','Finance','References','Archive'])add(n,'Documents',true);for(const [n,p,s,t]of [['MacExplorer — Architecture.pdf','Documents',2401200,'Work'],['Release checklist.md','Documents',12800,'Work'],['Interface exploration.fig','Documents',18420000,'Design'],['Project proposal.pages','Documents',834000,'Work'],['Design tokens.json','Documents',6800,'Design'],['September budget.numbers','Documents',321000,'Personal'],['Meeting notes.txt','Documents',2100,''],['App.swift','Projects',8200,'Work'],['Package.swift','Projects',1200,'Work'],['README.md','Projects',6700,''],['Components.fig','Design',4812300,'Design'],['Desktop wallpaper.jpg','Pictures',4270100,'Personal'],['Coastal morning.jpg','Pictures',5911200,''],['Alpine light.jpg','Pictures',7203400,''],['Quiet afternoon.jpg','Pictures',3200100,''],['Seaside study.jpg','Pictures',6530100,''],['Paper texture.png','Pictures',1200100,'Design'],['MacExplorer-0.1.0.zip','Downloads',32400000,''],['Typography guide.pdf','Downloads',5240000,''],['Welcome.txt','Desktop',1200,''],['Roadmap.md','iCloud Drive',3700,'Work'],['Ambient sketch.m4a','Music',3821000,''],['Old notes.txt','Trash',4500,'']])add(n,p,false,s,t);return a}
let saved;try{saved=JSON.parse(localStorage.getItem('macexplorer.design.v1')||'null')}catch{}
const state={files:saved?.files||initialFiles(),tabs:[{id:1,loc:'Home',history:['Home'],cursor:0}],tab:1,selected:new Set(['7']),query:'',view:'details',sort:'name',descending:false,inspector:true,clipboard:null,undo:[],redo:[],pins:saved?.pins||['Desktop','Downloads','Documents','Pictures'],hidden:false,extensions:true,compact:false,checkboxes:false,theme:saved?.theme||'light'};
function save(){try{localStorage.setItem('macexplorer.design.v1',JSON.stringify({files:state.files,pins:state.pins,theme:state.theme}))}catch{}}
const active=()=>state.tabs.find(t=>t.id===state.tab);const selected=()=>state.files.filter(f=>state.selected.has(f.id));const currentFolder=()=>['Home','Gallery','This Mac','Network'].includes(active().loc)?'Documents':active().loc;
const fileIcon=f=>f.folder?'<span class="foldericon small"></span>':`<span class="fileicon ${esc(f.name.split('.').pop().toLowerCase())}">${esc(f.name.split('.').pop().toUpperCase().slice(0,5))}</span>`;
const prettySize=n=>n?new Intl.NumberFormat('en',{maximumFractionDigits:1}).format(n>=1e6?n/1e6:n/1e3)+(n>=1e6?' MB':' KB'):'—';
function kind(f){if(f.folder)return 'File folder';return({pdf:'PDF document',md:'Markdown',fig:'Figma document',swift:'Swift source',json:'JSON document',pages:'Pages document',numbers:'Spreadsheet',jpg:'JPEG image',png:'PNG image',zip:'ZIP archive',m4a:'Audio'})[f.name.split('.').pop()]||'Text document'}
function visible(){let fs=state.files.filter(f=>active().loc==='Home'?!f.folder&&f.parent==='Documents':active().loc==='Gallery'?/\.(png|jpg)$/.test(f.name):active().loc.startsWith('tag:')?f.tag===active().loc.slice(4):f.parent===active().loc);if(!state.hidden)fs=fs.filter(f=>!f.name.startsWith('.'));if(state.query)fs=state.files.filter(f=>f.parent!=='Trash'&&f.name.toLowerCase().includes(state.query.toLowerCase()));return fs.sort((a,b)=>{if(a.folder!==b.folder)return a.folder?-1:1;let v=state.sort==='size'?a.size-b.size:state.sort==='type'?kind(a).localeCompare(kind(b)):state.sort==='date'?a.modified.localeCompare(b.modified):a.name.localeCompare(b.name,undefined,{numeric:true});return state.descending?-v:v})}
function checkpoint(){state.undo.push(JSON.stringify(state.files));state.redo=[];if(state.undo.length>40)state.undo.shift()}
function mutate(fn,msg){checkpoint();fn();save();render();if(msg)toast(msg,true)}
function undo(){if(!state.undo.length)return toast('Nothing to undo');state.redo.push(JSON.stringify(state.files));state.files=JSON.parse(state.undo.pop());save();render();toast('Action undone')}
function redo(){if(!state.redo.length)return;state.undo.push(JSON.stringify(state.files));state.files=JSON.parse(state.redo.pop());save();render();toast('Action redone')}
function go(loc,newTab=false){if(newTab){const id=Date.now();state.tabs.push({id,loc,history:[loc],cursor:0});state.tab=id}else{let t=active();if(t.loc!==loc){t.history=t.history.slice(0,t.cursor+1);t.history.push(loc);t.cursor++;t.loc=loc}}state.query='';state.selected.clear();render()}
function back(){let t=active();if(t.cursor>0){t.loc=t.history[--t.cursor];state.query='';state.selected.clear();render()}}
function forward(){let t=active();if(t.cursor<t.history.length-1){t.loc=t.history[++t.cursor];state.selected.clear();render()}}
function up(){const f=state.files.find(f=>f.folder&&f.name===active().loc);go(f?.parent||'Home')}
function closeTab(id){if(state.tabs.length===1)return toast('Keep at least one tab open');state.tabs=state.tabs.filter(t=>t.id!==id);if(state.tab===id)state.tab=state.tabs[0].id;render()}
function render(){document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('compact',state.compact);document.body.classList.toggle('checkboxes',state.checkboxes);document.getElementById('theme').innerHTML=icon('moon')+(state.theme==='dark'?'Light':'Dark');document.getElementById('tabs').innerHTML=state.tabs.map(t=>`<div class="tab ${t.id===state.tab?'active':''}"><button onclick="state.tab=${t.id};render()">${icon(t.loc==='Home'?'home':'folder')}${esc(t.loc)}</button><button class="close" title="Close tab" onclick="closeTab(${t.id})">×</button></div>`).join('')+`<button class="tabplus" title="New tab · ⌘T" onclick="go('Home',true)">${icon('plus')}</button>`;document.getElementById('back').disabled=active().cursor===0;document.getElementById('forward').disabled=active().cursor===active().history.length-1;document.getElementById('crumbs').innerHTML=`<button class="crumb" onclick="go('Home')">${icon('home')}</button><span class="chev">›</span><button class="crumb" onclick="go('This Mac')">This Mac</button><span class="chev">›</span><button class="crumb" onclick="editAddress()">${esc(active().loc.replace('tag:',''))}</button>`;const s=document.getElementById('search');s.placeholder='Search '+active().loc;s.value=state.query;renderSidebar();renderContent();icons()}
function sideitem(n,i,extra=''){return `<button class="sideitem ${active().loc===n?'active':''}" onclick="go('${n}')">${icon(i)}${esc(n)}${extra}</button>`}
function renderSidebar(){document.getElementById('sidebar').innerHTML=sideitem('Home','home')+sideitem('Gallery','gallery')+'<div class="sideheading">Cloud storage</div>'+sideitem('iCloud Drive','cloud','<span class="pin">✓</span>')+'<div class="sideheading">Quick access</div>'+state.pins.map(n=>sideitem(n,roots.find(r=>r[0]===n)?.[1]||'folder','<span class="pin">⌁</span>')).join('')+'<div class="sideheading">Locations</div>'+sideitem('This Mac','desktop')+sideitem('Network','network')+sideitem('Trash','trash',`<span class="count">${state.files.filter(f=>f.parent==='Trash').length}</span>`)+`<div class="sideheading">Tags</div>`+['Work','Design','Personal'].map((n,i)=>`<button class="sideitem ${active().loc==='tag:'+n?'active':''}" onclick="go('tag:${n}')"><i class="dot" style="background:${['#8b7ce0','#eea24e','#57af83'][i]}"></i>${n}</button>`).join('')+'<div class="sidefoot">Macintosh HD <div class="bar"><i style="width:38%"></i></div><span>628 GB available of 1 TB</span></div>'}
function table(fs){return `<table class="filetable" role="grid" aria-label="Files"><thead><tr><th onclick="sortBy('name')">Name ${state.sort==='name'?(state.descending?'↓':'↑'):''}</th><th onclick="sortBy('date')">Date modified</th><th onclick="sortBy('type')">Kind</th><th onclick="sortBy('size')">Size</th></tr></thead><tbody>${fs.map(f=>`<tr data-id="${f.id}" class="${state.selected.has(f.id)?'selected':''}" aria-selected="${state.selected.has(f.id)}" tabindex="0" draggable="true"><td><div class="filename"><input class="check" type="checkbox" tabindex="-1" ${state.selected.has(f.id)?'checked':''}>${fileIcon(f)}<span>${esc(state.extensions||f.folder?f.name:f.name.replace(/\.[^.]+$/,''))}</span></div></td><td class="muted">Today, 09:12</td><td class="muted">${kind(f)}</td><td class="muted">${prettySize(f.size)}</td></tr>`).join('')}</tbody></table>`}
function grid(fs){return `<div class="grid">${fs.map(f=>`<div class="tile ${state.selected.has(f.id)?'selected':''}" data-id="${f.id}" tabindex="0" role="option" aria-selected="${state.selected.has(f.id)}" draggable="true">${fileIcon(f)}<span>${esc(f.name)}</span></div>`).join('')}</div>`}
function renderContent(){const c=document.getElementById('content'),loc=active().loc,fs=visible();c.className='main'+(state.view==='details'&&loc!=='Home'&&loc!=='Gallery'&&!['This Mac','Network'].includes(loc)?' details':'');let html='';if(loc==='Home'&&!state.query){html=`<div class="viewhead"><div><h1>Home</h1><div class="sub">Everything you need. Right where you expect it.</div></div><button class="outline" onclick="showOptions()" title="Customize Home">${icon('settings')}</button></div><div class="sectionhead">${icon('star')} Quick access <span class="muted">· Pinned folders</span></div><div class="quickgrid">${['Desktop','Downloads','Documents','Pictures','Projects','Design'].map(n=>`<button class="quickcard" onclick="go('${n}')"><span class="foldericon"></span><span><strong>${n}</strong><small>${n==='Projects'||n==='Design'?'Documents':'This Mac'}</small></span></button>`).join('')}</div><div class="sectionhead">${icon('clock')} Recent <span class="muted">· Your latest work</span><span class="spacer"></span><button style="font-size:11px;color:var(--muted)" onclick="go('Documents')">View all ${icon('right')}</button></div>`}
if(loc==='This Mac'&&!state.query)html=`<div class="viewhead"><div><h1>This Mac</h1><div class="sub">Your folders, devices, and connected storage.</div></div></div><div class="sectionhead">Devices and drives</div><div class="drivegrid">${[['Macintosh HD','628 GB free of 1 TB',38,'Documents'],['Studio SSD','1.4 TB free of 2 TB',30,'Archive'],['iCloud Drive','148 GB free of 200 GB',26,'iCloud Drive']].map(d=>`<button class="drive" onclick="go('${d[3]}')">${icon('drive')}<span style="flex:1"><strong>${d[0]}</strong><div class="bar"><i style="width:${d[2]}%"></i></div><small>${d[1]}</small></span></button>`).join('')}</div><div class="sectionhead">Folders</div><div class="quickgrid">${['Desktop','Documents','Downloads','Pictures','Music','Projects'].map(n=>`<button class="quickcard" onclick="go('${n}')"><span class="foldericon"></span><strong>${n}</strong></button>`).join('')}</div><div class="feature-note">Sample device capacities. The SwiftUI app reads mounted volumes and capacity from macOS.</div>`;
else if(loc==='Network'&&!state.query)html=`<div class="viewhead"><div><h1>Network</h1><div class="sub">Connect to your shared folders.</div></div><button class="primary" onclick="connect()">${icon('plus')}Connect to server</button></div><div class="drivegrid"><button class="drive" onclick="connect()">${icon('network')}<span><strong>Studio NAS</strong><br><small>smb://studio.local</small></span></button></div><div class="feature-note">This browser prototype demonstrates the connection dialog. Credentials are never requested or stored here. The macOS application delegates mounting to the operating system.</div>`;
else if(loc==='Gallery'&&!state.query){html=`<div class="viewhead"><div><h1>Gallery</h1><div class="sub">A little inspiration, all in one place.</div></div><button class="outline" onclick="go('Pictures')">Open Pictures</button></div><div class="sectionhead">September 2026 <span class="muted">· ${fs.length} photos</span></div><div class="gallery">${fs.map(f=>`<div class="photo ${state.selected.has(f.id)?'selected':''}" data-id="${f.id}" tabindex="0" role="option"><span>${esc(f.name)}</span></div>`).join('')}</div><div class="feature-note">Illustrative artwork in the design prototype. Native Gallery uses your actual file thumbnails.</div>`}
else{if(loc==='Trash')html='<div class="feature-note" style="margin:14px">Items in Trash <button class="outline" onclick="restore()">Restore selected</button></div>';html+=fs.length?(state.view==='grid'?grid(fs):table(fs)):`<div class="empty">${icon(state.query?'search':'folder')}<h3>${state.query?'No matching files':'This folder is empty'}</h3><p>${state.query?'Try another file name.':'Create a folder or paste items here.'}</p><button class="outline" onclick="createFolder()">New folder</button></div>`}c.innerHTML=html;bindFiles();document.getElementById('status').textContent=fs.length+' items';document.getElementById('selectionstatus').textContent=selected().length?selected().length+' selected · '+prettySize(selected().reduce((s,f)=>s+f.size,0)):'';document.getElementById('detailsbtn').classList.toggle('active',state.view==='details');document.getElementById('gridbtn').classList.toggle('active',state.view==='grid');document.querySelectorAll('.needs-selection').forEach(b=>b.disabled=!selected().length);renderInspector()}
function bindFiles(){document.querySelectorAll('[data-id]').forEach(el=>{el.onclick=e=>{const id=el.dataset.id,fs=visible(),last=[...state.selected].at(-1);if(e.shiftKey&&last){let a=fs.findIndex(f=>f.id===last),b=fs.findIndex(f=>f.id===id);if(a<0)a=b;for(let i=Math.min(a,b);i<=Math.max(a,b);i++)state.selected.add(fs[i].id)}else if(e.metaKey||e.ctrlKey||e.target.type==='checkbox'){state.selected.has(id)?state.selected.delete(id):state.selected.add(id)}else state.selected=new Set([id]);renderContent();document.getElementById('content').focus({preventScroll:true})};el.ondblclick=()=>openFile(state.files.find(f=>f.id===el.dataset.id));el.oncontextmenu=e=>{e.preventDefault();if(!state.selected.has(el.dataset.id))state.selected=new Set([el.dataset.id]);renderContent();showMenu({getBoundingClientRect:()=>({left:e.clientX,bottom:e.clientY})},'context')};el.ondragstart=e=>{if(!state.selected.has(el.dataset.id))state.selected=new Set([el.dataset.id]);e.dataTransfer.setData('text/plain',[...state.selected].join(','));e.dataTransfer.effectAllowed='copyMove'};el.ondragover=e=>{if(state.files.find(f=>f.id===el.dataset.id)?.folder)e.preventDefault()};el.ondrop=e=>{e.preventDefault();const dest=state.files.find(f=>f.id===el.dataset.id);if(dest?.folder){state.clipboard={ids:e.dataTransfer.getData('text/plain').split(','),cut:!e.altKey};paste(dest.name)}}})}
function renderInspector(){const el=document.getElementById('inspector');el.classList.toggle('hidden',!state.inspector);let f=selected()[0];if(!f){el.innerHTML=`<div class="inspecthead">Details<button onclick="toggleInspector()" title="Close details">×</button></div><div class="empty" style="padding:65px 0">${icon('info')}<p>Select a file to see its details.</p></div>`;return}el.innerHTML=`<div class="inspecthead">Details<button onclick="toggleInspector()" title="Close details">×</button></div><div class="preview">${f.folder?'<span class="foldericon" style="transform:scale(2)"></span>':f.name.endsWith('.pdf')?'<div class="preview-art"><div class="artline title"></div><div class="artline"></div><div class="artline" style="width:70%"></div><div class="diagram"><b></b><i></i><b></b><i></i><b></b></div><div class="artline"></div><div class="artline"></div><div class="artline" style="width:60%"></div></div>':`<div class="fileicon big ${esc(f.name.split('.').pop())}">${esc(f.name.split('.').pop().toUpperCase())}</div>`}</div><h3>${selected().length>1?selected().length+' items selected':esc(f.name)}</h3><p>${kind(f)}${f.size?' · '+prettySize(f.size):''}</p><div class="inspectactions"><button class="primary" onclick="quickLook()">${icon('search')}Quick Look</button><button class="outline" onclick="share()">${icon('share')}</button></div><dl class="meta"><dt>Where</dt><dd>This Mac › ${esc(f.parent)}</dd><dt>Created</dt><dd>14 September 2026</dd><dt>Modified</dt><dd>Today at 09:12</dd><dt>Size</dt><dd>${prettySize(f.size)}</dd><dt>Availability</dt><dd><span style="color:#39a36b">✓</span> Available on this Mac</dd></dl><div class="sectionhead" style="margin-top:24px">Tags</div>${f.tag?`<span class="tag"><i></i>${esc(f.tag)}</span>`:''}<button class="tag" onclick="editTag()">+ Add tag</button><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:15px"><button style="font-size:11px;color:var(--accent)" onclick="properties()">Show all properties ${icon('right')}</button></div>`}
function openFile(f){if(!f)return;if(f.folder)go(f.name);else quickLook(f)}
function quickLook(f=selected()[0]){if(!f)return;dialog(f.name,`<div class="preview" style="height:240px">${f.folder?'<span class="foldericon" style="transform:scale(3)"></span>':`<div class="fileicon big">${esc(f.name.split('.').pop().toUpperCase())}</div>`}</div><p>${kind(f)} · ${prettySize(f.size)}<br>Prototype preview. The native app uses macOS Quick Look for real document, image, video, and audio previews.</p>`,[{title:'Done',primary:true,action:closeDialog}])}
function copy(cut){if(!selected().length)return;state.clipboard={ids:[...state.selected],cut};toast(selected().length+' item'+(selected().length>1?'s':'')+(cut?' ready to move':' copied'))}
function uniqueName(name,parent){if(!state.files.some(f=>f.name===name&&f.parent===parent))return name;let ext=name.includes('.')?'.'+name.split('.').pop():'',base=ext?name.slice(0,-ext.length):name,i=2;while(state.files.some(f=>f.name===base+' ('+i+')'+ext&&f.parent===parent))i++;return base+' ('+i+')'+ext}
function paste(parent=currentFolder()){if(!state.clipboard?.ids.length)return toast('Copy or cut files first');const clip=state.clipboard,files=state.files.filter(f=>clip.ids.includes(f.id));if(files.some(f=>f.folder&&(f.name===parent||isDescendant(parent,f.name))))return toast('A folder cannot be placed inside itself');const conflicts=files.some(f=>f.parent!==parent&&state.files.some(g=>g.parent===parent&&g.name===f.name));const apply=()=>{mutate(()=>{const clone=(f,p)=>{const name=uniqueName(f.name,p),n={...f,id:crypto.randomUUID(),name,parent:p};state.files.push(n);if(f.folder)state.files.filter(x=>x.parent===f.name&&x.id!==n.id).slice().forEach(x=>clone(x,name))};for(const f of files){if(clip.cut){if(f.parent!==parent){f.name=uniqueName(f.name,parent);f.parent=parent}}else clone(f,parent)}},clip.cut?'Items moved':'Items copied');if(clip.cut)state.clipboard=null;closeDialog()};if(conflicts)dialog('Files with the same name',`<p>The destination already contains an item with this name. Keep both to create a numbered copy. No file will be overwritten.</p>`,[{title:'Cancel',action:closeDialog},{title:'Keep both',primary:true,action:apply}]);else apply()}
function isDescendant(loc,folder,seen=new Set()){if(seen.has(loc))return false;seen.add(loc);const f=state.files.find(f=>f.folder&&f.name===loc);return !!f&&(f.parent===folder||isDescendant(f.parent,folder,seen))}
function validName(n){return n&&n.trim()&&!/[\/\x00]/.test(n)&&n!=='.'&&n!=='..'}
function createFolder(isFile=false){dialog(isFile?'New text document':'New folder',`<p>Create in ${esc(currentFolder())}</p><input id="nameinput" value="${isFile?'Untitled.txt':'New folder'}" aria-label="Name">`,[{title:'Cancel',action:closeDialog},{title:'Create',primary:true,action:()=>{const n=document.getElementById('nameinput').value.trim();if(!validName(n))return toast('Enter a valid file name');mutate(()=>state.files.push({id:crypto.randomUUID(),name:uniqueName(n,currentFolder()),parent:currentFolder(),folder:!isFile,size:0,modified:new Date().toISOString(),tag:''}),'Created '+n);closeDialog()}}]);document.getElementById('nameinput').select()}
function rename(){const f=selected()[0];if(!f)return;dialog('Rename',`<p>Choose a new name for this ${f.folder?'folder':'file'}.</p><input id="nameinput" value="${esc(f.name)}" aria-label="New name">`,[{title:'Cancel',action:closeDialog},{title:'Rename',primary:true,action:()=>{const n=document.getElementById('nameinput').value.trim();if(!validName(n))return toast('Enter a valid file name');if(state.files.some(g=>g.id!==f.id&&g.parent===f.parent&&g.name===n))return toast('That name is already in use');mutate(()=>{if(f.folder)state.files.filter(g=>g.parent===f.name).forEach(g=>g.parent=n);f.name=n},'Item renamed');closeDialog()}}]);document.getElementById('nameinput').select()}
function trash(){if(!selected().length)return;if(active().loc==='Trash')return toast('Permanent deletion is intentionally disabled in this preview');mutate(()=>selected().forEach(f=>{f.original=f.parent;f.parent='Trash'}),'Moved to Trash');state.selected.clear();render()}
function restore(){if(!selected().length)return toast('Select an item in Trash');mutate(()=>selected().forEach(f=>{if(f.parent==='Trash'){f.parent=f.original||'Documents';f.original=null}}),'Items restored')}
function editTag(){const f=selected()[0];if(!f)return;dialog('Tags',`<p>Add a macOS-style tag to the selected files.</p><select id="taginput"><option>Work</option><option>Design</option><option>Personal</option><option value="">No tag</option></select>`,[{title:'Cancel',action:closeDialog},{title:'Save',primary:true,action:()=>{const t=document.getElementById('taginput').value;mutate(()=>selected().forEach(x=>x.tag=t),'Tags updated');closeDialog()}}])}
function properties(){const f=selected()[0];if(!f)return;dialog(f.name+' — Properties',`<div style="display:flex;gap:15px;align-items:center;margin:18px 0">${fileIcon(f)}<strong>${esc(f.name)}</strong></div><dl class="meta"><dt>Kind</dt><dd>${kind(f)}</dd><dt>Location</dt><dd>~/ ${esc(f.parent)}</dd><dt>Size</dt><dd>${prettySize(f.size)}</dd><dt>Modified</dt><dd>14 September 2026, 09:12</dd><dt>Permissions</dt><dd>Read & write (sample)</dd><dt>Tags</dt><dd>${esc(f.tag||'None')}</dd></dl><p>Permissions and dates here describe sample data, not your filesystem.</p>`,[{title:'Done',primary:true,action:closeDialog}])}
function share(){if(!selected().length)return;dialog('Share '+(selected().length>1?selected().length+' items':selected()[0].name),`<p>Native share-sheet interaction preview.</p><div style="display:flex;gap:15px;margin:25px 0">${['AirDrop','Mail','Messages'].map(n=>`<button class="outline" onclick="toast('${n} is available in the native macOS app')">${icon('share')}${n}</button>`).join('')}</div><p>The web design does not upload files or send messages.</p>`,[{title:'Done',primary:true,action:closeDialog}])}
function connect(){dialog('Connect to Server','<p>Enter a server address. The native app uses the macOS network authentication dialog.</p><input id="server" placeholder="smb://server.local/share" aria-label="Server address"><p>No credentials are collected by this prototype.</p>',[{title:'Cancel',action:closeDialog},{title:'Connect',primary:true,action:()=>{const v=document.getElementById('server').value;if(!/^(smb|afp|nfs):\/\/[^\s]+$/.test(v))return toast('Enter an smb://, afp://, or nfs:// address');closeDialog();toast('Connection flow previewed; use the native app to mount a server')}}])}
function sortBy(key){if(state.sort===key)state.descending=!state.descending;else{state.sort=key;state.descending=false}renderContent()}
function setView(v){state.view=v;renderContent();closeMenu()}
function toggleInspector(){state.inspector=!state.inspector;renderInspector()}
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';save();render()}
function editAddress(){document.getElementById('crumbs').style.display='none';let p=document.getElementById('path');p.style.display='block';p.value='~/'+active().loc;p.focus();p.select()}
function endAddress(){document.getElementById('path').style.display='none';document.getElementById('crumbs').style.display='flex'}
function addressKey(e){if(e.key==='Escape')endAddress();if(e.key==='Enter'){const p=e.target.value.replace(/^~?\//,'').split('/').filter(Boolean).pop()||'Home';if(roots.some(r=>r[0]===p)||state.files.some(f=>f.folder&&f.name===p)){go(p);endAddress()}else toast('Folder not found in the sample filesystem')}}
function dialog(title,body,buttons){closeMenu();const portal=document.getElementById('portal');portal.innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h2 id="dialogtitle">${esc(title)}</h2>${body}<div class="buttons">${buttons.map((b,i)=>`<button class="${b.primary?'primary':'outline'}" id="dialogbtn${i}">${esc(b.title)}</button>`).join('')}</div></section></div>`;buttons.forEach((b,i)=>document.getElementById('dialogbtn'+i).onclick=b.action);const focusable=portal.querySelectorAll('button,input,select');focusable[0]?.focus();portal.onkeydown=e=>{if(e.key==='Tab'){let first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();buttons.find(b=>b.primary)?.action()}}}
function closeDialog(){document.getElementById('portal').innerHTML='';document.getElementById('content').focus({preventScroll:true})}
let toastTimer;function toast(msg,canUndo=false){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=icon('check')+`<span>${esc(msg)}</span>`+(canUndo?'<button onclick="undo()">Undo</button>':'');document.body.append(d);toastTimer=setTimeout(()=>d.remove(),4200)}
function closeMenu(){document.querySelector('.menu')?.remove()}
function showMenu(anchor,type){closeMenu();const check=v=>v?'✓ ':'';let items=[];const item=(title,action,key='')=>({title,action,key});if(type==='new')items=[item('New folder',()=>createFolder(),'⇧⌘N'),item('Text document',()=>createFolder(true))];if(type==='sort')items=['name','date','type','size'].map(k=>item(check(state.sort===k)+({name:'Name',date:'Date modified',type:'Kind',size:'Size'})[k],()=>sortBy(k))).concat([null,item(check(state.descending)+'Descending',()=>{state.descending=!state.descending;renderContent()})]);if(type==='view')items=[item(check(state.view==='grid')+'Large icons',()=>setView('grid')),item(check(state.view==='details')+'Details',()=>setView('details')),null,item(check(state.compact)+'Compact view',()=>{state.compact=!state.compact;render()}),item(check(state.inspector)+'Details pane',toggleInspector),item(check(state.checkboxes)+'Item check boxes',()=>{state.checkboxes=!state.checkboxes;render()}),item(check(state.extensions)+'File name extensions',()=>{state.extensions=!state.extensions;render()}),item(check(state.hidden)+'Hidden items',()=>{state.hidden=!state.hidden;render()})];if(type==='more')items=[item('Select all',()=>{state.selected=new Set(visible().map(f=>f.id));renderContent()},'⌘A'),item('Invert selection',()=>{state.selected=new Set(visible().filter(f=>!state.selected.has(f.id)).map(f=>f.id));renderContent()}),item('Clear selection',()=>{state.selected.clear();renderContent()}),null,item('Undo',undo,'⌘Z'),item('Redo',redo,'⇧⌘Z'),null,item('Connect to server…',connect,'⌘K'),item('Folder options…',showOptions)];if(type==='context')items=[item('Open',()=>openFile(selected()[0]),'↵'),item('Open in new tab',()=>go(selected()[0].folder?selected()[0].name:selected()[0].parent,true)),item('Quick Look',()=>quickLook(),'Space'),null,item('Cut',()=>copy(true),'⌘X'),item('Copy',()=>copy(false),'⌘C'),item('Paste',()=>paste(),'⌘V'),item('Rename…',rename,'F2'),item(active().loc==='Trash'?'Restore':'Move to Trash',active().loc==='Trash'?restore:trash,'⌫'),null,item('Pin to Quick access',()=>{const f=selected()[0];if(f?.folder&&!state.pins.includes(f.name)){state.pins.push(f.name);save();renderSidebar()}else toast('Select an unpinned folder')}),item('Tags…',editTag),item('Properties',properties,'⌘I')];const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');m.innerHTML=items.map((it,i)=>it?`<button role="menuitem" data-menu="${i}">${esc(it.title)}<span class="key">${esc(it.key)}</span></button>`:'<hr>').join('');document.body.append(m);const r=anchor.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-12)+'px';m.style.top=Math.min(r.bottom+5,innerHeight-m.offsetHeight-12)+'px';m.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{closeMenu();items[+b.dataset.menu].action()});m.querySelector('button')?.focus()}
function showOptions(){dialog('Folder options',`<p>Explorer conventions. Mac-native expression.</p><label><input type="checkbox" id="optcompact" ${state.compact?'checked':''}>Use compact file rows</label><label><input type="checkbox" id="optext" ${state.extensions?'checked':''}>Show file name extensions</label><label><input type="checkbox" id="opthidden" ${state.hidden?'checked':''}>Show hidden items</label><label><input type="checkbox" id="optcheck" ${state.checkboxes?'checked':''}>Show item check boxes</label><label><input type="checkbox" id="optdetails" ${state.inspector?'checked':''}>Show details pane</label><p>Keyboard shortcuts accept Command and Control. File changes are saved locally in this browser.</p>`,[{title:'Reset demo',action:()=>{state.files=initialFiles();state.undo=[];state.redo=[];state.pins=['Desktop','Downloads','Documents','Pictures'];save();closeDialog();render()}},{title:'Apply',primary:true,action:()=>{for(const [key,id]of [['compact','optcompact'],['extensions','optext'],['hidden','opthidden'],['checkboxes','optcheck'],['inspector','optdetails']])state[key]=document.getElementById(id).checked;closeDialog();render()}}])}
function showGuide(){dialog('Make yourself at home',`<p>This is a working design, not a screenshot. Browse folders, open tabs, search, sort, switch views, select files, inspect properties, and try file operations.</p><dl class="meta"><dt>Navigate</dt><dd>Double-click folders; Alt + arrows; edit the address bar</dd><dt>Select</dt><dd>Click, Command/Control-click, Shift-click, or arrow keys</dd><dt>Organize</dt><dd>New folder, cut/copy/paste, F2 rename, Delete, undo/redo</dd><dt>Inspect</dt><dd>Space for Quick Look; Command + I for properties</dd><dt>Tabs</dt><dd>Command + T / W; click any tab to switch</dd><dt>Appearance</dt><dd>Light/dark themes, compact rows, check boxes, view modes</dd></dl><p>All data is fictional. Operating-system interactions are explicitly labeled as previews.</p>`,[{title:'Start exploring',primary:true,action:closeDialog}])}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[onclick*="showMenu"]'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeDialog();endAddress();return}if(e.target.matches('input,textarea,select')||document.querySelector('.overlay'))return;const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();let handled=true;if(mod&&k==='t')go('Home',true);else if(mod&&k==='w')closeTab(state.tab);else if(mod&&k==='l')editAddress();else if(mod&&k==='f')document.getElementById('search').focus();else if(mod&&k==='a'){state.selected=new Set(visible().map(f=>f.id));renderContent()}else if(mod&&k==='c')copy(false);else if(mod&&k==='x')copy(true);else if(mod&&k==='v')paste();else if(mod&&k==='z')e.shiftKey?redo():undo();else if(mod&&k==='i')properties();else if(mod&&k==='k')connect();else if(mod&&e.shiftKey&&k==='n')createFolder();else if(e.key==='F2')rename();else if(e.key==='F5')render();else if(e.key==='Delete'||e.key==='Backspace')trash();else if(e.key===' ')quickLook();else if(e.key==='Enter')openFile(selected()[0]);else if(e.altKey&&e.key==='ArrowLeft')back();else if(e.altKey&&e.key==='ArrowRight')forward();else if(e.altKey&&e.key==='ArrowUp')up();else if(e.key==='ArrowDown'||e.key==='ArrowUp'){const fs=visible();let n=fs.findIndex(f=>state.selected.has(f.id));n=Math.max(0,Math.min(fs.length-1,n+(e.key==='ArrowDown'?1:-1)));if(fs[n]){if(!e.shiftKey)state.selected.clear();state.selected.add(fs[n].id);renderContent();document.querySelector(`[data-id="${fs[n].id}"]`)?.scrollIntoView({block:'nearest'})}}else handled=false;if(handled)e.preventDefault()});
render();
</script></body></html>
