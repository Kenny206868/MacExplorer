name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # Explicit milestones finish even when the next edit is pushed; ordinary
  # integration runs collapse to the newest branch revision.
  group: ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[alpha]') && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  prioritize:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retire superseded integration runs, preserving alpha milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prioritize-ci.py
  native:
    uses: ./.github/workflows/build.yml
    with:
      version: '0.1.0'
  visual:
    uses: ./.github/workflows/visual.yml
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check scripts and manifest generation
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
          VERSION=0.1.0 python3 scripts/make-info.py /tmp/MacExplorer-Info.plist
          python3 scripts/check-design.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
