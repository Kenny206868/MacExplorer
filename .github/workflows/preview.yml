name: Publish alpha preview
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alpha-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact successful main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Fetch this run's native application and both native view galleries
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name MacExplorer-universal --dir native
          for platform in macos-15-intel macos-26; do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "MacExplorer-native-views-$platform" --dir "views/MacExplorer-native-views-$platform"
          done
      - name: Verify and assemble matching distributions and visual evidence
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
          ALPHA_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          python3 scripts/assemble-alpha.py --native native --views views --output alpha --commit "$SOURCE_SHA" --build "$BUILD_URL" --number "$ALPHA_NUMBER"
      - name: Publish alpha without moving an existing tag or stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ALPHA_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          TAG="alpha-$SOURCE_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            [[ "$(jq -r .targetCommitish existing.json)" == "$SOURCE_SHA" ]] || { echo 'Refusing to overwrite another commit.'; exit 1; }
            if [[ "$(jq -r .isDraft existing.json)" == false ]]; then
              echo "Alpha already published: $TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title "Alpha $ALPHA_NUMBER · ${SOURCE_SHA:0:12}" --notes-file alpha-notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" alpha/* --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --notes-file alpha-notes.md
          printf 'Published alpha: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
