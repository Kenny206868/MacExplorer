name: Publish development preview
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact successful main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download only this run's verified universal artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name MacExplorer-universal --dir native
          (cd native && sha256sum -c SHA256SUMS)
          test -f native/INSTALL.md
      - name: Assemble source, design and native distribution together
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p preview
          cp native/*.zip native/*.dmg native/INSTALL.md preview/
          git archive --format=zip --prefix=MacExplorer/ --output=preview/MacExplorer-source.zip HEAD
          (cd Design && zip -q -r ../preview/MacExplorer-design.zip .)
          printf '%s\n' "$SOURCE_SHA" > preview/COMMIT.txt
          printf '%s\n' "$BUILD_URL" > preview/BUILD.txt
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('preview')
          manifest = {
              'schemaVersion': 1,
              'channel': 'development-preview',
              'sourceCommit': os.environ['SOURCE_SHA'],
              'buildURL': os.environ['BUILD_URL'],
              'architectures': ['arm64', 'x86_64'],
              'minimumMacOS': '14.0',
              'signing': 'ad-hoc',
              'notarized': False,
              'automaticUpdateFeed': False,
              'files': sorted(p.name for p in root.iterdir() if p.is_file()),
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          (cd preview && sha256sum *.zip *.dmg INSTALL.md COMMIT.txt BUILD.txt manifest.json > SHA256SUMS)
          {
            printf '## Development preview\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf '[Successful native build and core tests](%s).\n\n' "$BUILD_URL"
            printf 'This is an **ad-hoc-signed development build, not Apple notarized**. It is not a production certification or a claim of complete Windows/Finder parity. Read `INSTALL.md` before opening the app.\n\n'
            printf 'The ZIP and DMG contain the same universal app built by the linked CI run. Source and interactive-design ZIPs match the same commit. `SHA256SUMS` and `manifest.json` provide provenance.\n\n'
            printf 'This prerelease does **not** publish or replace the signed Sparkle appcast, change the production latest release, or load Apple/Sparkle signing secrets. Production updates continue to use the explicit version-tag release workflow.\n'
          } > preview-notes.md
      - name: Publish once, draft first, without moving existing tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="preview-$SOURCE_SHA"
          TITLE="Development preview ${SOURCE_SHA:0:12}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            [[ "$(jq -r .targetCommitish existing.json)" == "$SOURCE_SHA" ]] || { echo 'Existing tag/release targets a different commit; refusing to overwrite.'; exit 1; }
            if [[ "$(jq -r .isDraft existing.json)" == false ]]; then
              printf 'Preview already published: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title "$TITLE" --notes-file preview-notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" preview/* --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false --notes-file preview-notes.md
          printf 'Published immutable development preview: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
