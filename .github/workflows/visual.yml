name: Native visual validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swiftui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      MACEXPLORER_SNAPSHOT_DIR: ${{ github.workspace }}/artifacts/native-views
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture production SwiftUI views and validate native layout and state
        run: |
          set -o pipefail
          mkdir -p artifacts/native-views
          xcodebuild -version > artifacts/native-views/toolchain.txt
          swift --version >> artifacts/native-views/toolchain.txt
          uname -m >> artifacts/native-views/toolchain.txt
          git rev-parse HEAD > artifacts/native-views/COMMIT.txt
          swift test --filter MacExplorerUITests 2>&1 | tee artifacts/native-views/test.log
      - name: Validate coverage, dimensions, and render content
        run: python3 scripts/validate-snapshots.py artifacts/native-views
      - name: Test optimized native input and scrolling
        id: optimized
        if: matrix.os == 'macos-26'
        env:
          MACEXPLORER_SNAPSHOT_DIR: ${{ github.workspace }}/artifacts/native-views/optimized-performance
        run: python3 scripts/measure-native-performance.py
      - name: Validate optimized performance provenance and budgets
        if: matrix.os == 'macos-26' && steps.optimized.outcome == 'success'
        env:
          PERFORMANCE_DIR: ${{ github.workspace }}/artifacts/native-views/optimized-performance
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p 'test_performance_validation.py' -v
          python3 scripts/validate-performance.py "$PERFORMANCE_DIR" --commit "$GITHUB_SHA" 2>&1 | tee "$PERFORMANCE_DIR/validation.log"
      - name: Upload native PNGs, timing evidence, test log, and offline review gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MacExplorer-native-views-${{ matrix.os }}
          path: artifacts/native-views
          if-no-files-found: error
          retention-days: 30
